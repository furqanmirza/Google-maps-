<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SmartRoute — Live-Traffic TSP Optimizer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" type="text/css" href="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">
  <header>
    <h1>SmartRoute</h1>
    <p>Optimize multi-stop itineraries with live traffic. Born from a graduation road trip across Arizona.</p>
  </header>

  <div id="layout">
    <aside id="panel">
      <h2>Stops</h2>
      <p class="note">Note: The first location you add is locked as your starting origin.</p>

      <div id="search-box">
        <input id="search-input" placeholder="Search for a place or address..." autocomplete="off" />
        <div id="suggestions"></div>
      </div>

      <div id="stop-list"></div>

      <button id="optimize-btn">Optimize Route (Live Traffic)</button>
      <div id="result"></div>
    </aside>

    <main id="map"></main>
  </div>
</div>

<script>
  window.TOMTOM_API_KEY = "YOUR_TOMTOM_API_KEY";
</script>
<script src="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps-web.min.js"></script>
<script src="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/services/services-web.min.js"></script>
<script src="app.js"></script>
</body>
</html>
